[workspace]
resolver = "3"
members = ["common_type_aliases", "db_manager", "env_reader", "forum","html_templating", "id_generator", "password_hashing", "read_on_dev_embed_on_release","server", "session", "storage", "tests", "user"]

[workspace.dependencies]
uuid = { version = "1.19.0", features = ["v4"] }
urlencoding = "2.1.3"
askama = { version = "0.15", features = ["std", "derive"] }
postgres = "0.19.12"
blake3 = "1.8.2"
rand = "0.9.2"
hex = "0.4.3"
r2d2 = "0.8.10"
r2d2_postgres = "0.18.2"
