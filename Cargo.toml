[workspace]
resolver = "3"
members = ["workspace_crates/*"]

[workspace.dependencies]

# internal workspace crates

db_manager = { path = "workspace_crates/db_manager" }
config_reader = { path = "workspace_crates/config_reader" } 
error_structs = { path = "workspace_crates/error_structs" }
forum = { path = "workspace_crates/forum" }
html_templating = { path = "workspace_crates/html_templating" }
id_generator = { path = "workspace_crates/id_generator" }
password_hashing = { path = "workspace_crates/password_hashing" }
read_on_dev_embed_on_release = { path = "workspace_crates/read_on_dev_embed_on_release" }
server = { path = "workspace_crates/server" }
session = { path = "workspace_crates/session" }
session_structs_and_so_on = { path = "workspace_crates/session_structs_and_so_on" }
user = { path = "workspace_crates/user" }
into_vec = { path = "workspace_crates/into_vec" }
routing = { path = "workspace_crates/routing" }
http_stuff = { path = "workspace_crates/http_stuff" }
abac = { path = "workspace_crates/abac" }
csrf_stuff = { path = "workspace_crates/csrf_stuff" }
pagination = { path = "workspace_crates/pagination" }
url = { path = "workspace_crates/url" }
encoding = { path = "workspace_crates/encoding" }




# third-party external crates
indexmap = "2.13.0"
sqlx = { version = "0.8.6", features = ["postgres", "macros", "runtime-tokio", "time"] }

tokio = { version = "1.49.0", features = ["full"] }

askama = { version = "0.15", features = ["std", "derive"] }

blake3 = "1.8.2"


rand = "0.9.2"
hex = "0.4.3"
uuid = { version = "1.19.0", features = ["v4"] }
urlencoding = "2.1.3"
percent-encoding = "2.3.2"



