[workspace]
resolver = "3"
members = ["workspace_crates/*"]

[workspace.dependencies]

askama = { version = "0.15", features = ["std", "derive"] }

blake3 = "1.8.2"

rand = "0.9.2"
hex = "0.4.3"
uuid = { version = "1.19.0", features = ["v4"] }
urlencoding = "2.1.3"

postgres = "0.19.12"
postgres-types = {version ="0.2.11", features = ["derive"]}
r2d2 = "0.8.10"
r2d2_postgres = "0.18.2"
