[profile.release]
# Maximum optimization level for speed
opt-level = 3

# Full Link Time Optimization (LTO) across all crates
lto = "fat"

# Single codegen unit allows for more global optimizations
codegen-units = 1

# hmm... do I want this?
overflow-checks = true


[workspace]
resolver = "3"
members = ["workspace_crates/*"]

[workspace.dependencies]
 
# internal workspace crates
site_config  =  { path = "workspace_crates/site_config" }
routes  =  { path = "workspace_crates/routes" }
payment_system_client  =  { path = "workspace_crates/payment_system_client" }
financial_stuff  =  { path = "workspace_crates/financial_stuff" }
custom_site_variables  =  { path = "workspace_crates/custom_site_variables" }
cryptocurrencies_stuff  =  { path = "workspace_crates/cryptocurrencies_stuff" }
invoice = { path = "workspace_crates/invoice" }
email_otp = { path = "workspace_crates/email_otp" }
dynamic_stylesheets = { path = "workspace_crates/dynamic_stylesheets" }
count_string_length = { path = "workspace_crates/count_string_length" }
webhooks = { path = "workspace_crates/webhooks" }
cloudflare_turnstile = { path = "workspace_crates/cloudflare_turnstile" }
custom_site_pages = { path = "workspace_crates/custom_site_pages" }
db_manager = { path = "workspace_crates/db_manager" } 
forum = { path = "workspace_crates/forum" }
html_templating = { path = "workspace_crates/html_templating" }
id_generator = { path = "workspace_crates/id_generator" }
id_generator_unique_in_db = { path = "workspace_crates/id_generator_unique_in_db" }
password_hashing = { path = "workspace_crates/password_hashing" }
session = { path = "workspace_crates/session" }
session_structs_and_so_on = { path = "workspace_crates/session_structs_and_so_on" }
user = { path = "workspace_crates/user" }
user_creation = { path = "workspace_crates/user_creation" }
into_vec = { path = "workspace_crates/into_vec" }
routing = { path = "workspace_crates/routing" }
routing_structs = { path = "workspace_crates/routing_structs" }
abac = { path = "workspace_crates/abac" }
csrf_stuff = { path = "workspace_crates/csrf_stuff" }
pagination = { path = "workspace_crates/pagination" }
app_executable_version = { path = "workspace_crates/app_executable_version" }


payment_system_structs = { git = "ssh://git@github.com/Aeroel/payment_system.git" } 
config_reader = { git = "ssh://git@github.com/Aeroel/server_2_only.git" } 
server_config = { git = "ssh://git@github.com/Aeroel/server_2_only.git" } 
server = { git = "ssh://git@github.com/Aeroel/server_2_only.git"}
http_stuff = { git = "ssh://git@github.com/Aeroel/server_2_only.git"}
encoding = { git = "ssh://git@github.com/Aeroel/server_2_only.git" }
url = {git = "ssh://git@github.com/Aeroel/server_2_only.git" } 
error_structs = { git = "ssh://git@github.com/Aeroel/server_2_only.git" }



# third-party external crates
# for injecting stylesheet links
strum = { version = "0.28", features = ["derive"] }
lol_html = "2.8.1"

chrono = "0.4.44"

unicode-segmentation = "1.13.2"
git-version = "0.3.9"

dotenvy = "0.15.7"
config = "0.15.22"

tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter", "json"] }
tracing-appender = "0.2.5"

regex = "1.12.3"
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
humantime-serde = "1.1.1"

indexmap = "2.14.0"
sqlx = { version = "0.8.6", features = ["migrate", "postgres", "macros", "runtime-tokio", "time", "tls-rustls-aws-lc-rs"] }

tokio = { version = "1.51.1", features = ["full", "tracing"] }


askama = { version = "0.15.6", features = ["std", "derive"] }

argon2 = {version = "0.5.3", features = ["zeroize"] }


rand = "0.10.1"
hex = "0.4.3"
uuid = { version = "1.23.0", features = ["v4"] }
urlencoding = "2.1.3"
percent-encoding = "2.3.2"



