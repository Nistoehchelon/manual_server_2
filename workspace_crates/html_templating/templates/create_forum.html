{% extends "template_base.html" %}

{% block content%}
{% include "includes/notifications.html" %}
<form action="/create_forum" method="POST">
    <p> Custom forum id (leave [auto] for auto-generation): <input name="custom_id" type="text" value="[auto]"></p>

</form>
{%endblock%}
