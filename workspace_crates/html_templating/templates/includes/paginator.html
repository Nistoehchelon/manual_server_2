{% if  paginator.elements.len() > 0 %}
<div class = "paginator" id = "{{ paginator.name }}">
    {% for element in paginator.elements %}
   {% if element.linked %}
      <a href = "{{ element.link_url }}">
   {% endif %}
         {{ element.name }}
   {% if element.linked %}
      </a>
   {% endif %}
 {% endfor %}
</div>
{% endif %}
