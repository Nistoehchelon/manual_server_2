{% extends "template_base.html" %}

{% block head %}
{% if main_info.cloudflare_turnstile_enabled %}
<script
  src="https://challenges.cloudflare.com/turnstile/v0/api.js"  nonce="{{ main_info.nonce }}"
  async
  defer
></script>
{% endif %}

{% endblock %}


{% block content%}
<h1>Log in 😊</h1>
{% include "includes/notifications.html" %}
<form method="POST" action="/login">
    <input type="text" name="username" placeholder="Enter your username" required><br>
    <input type="password" name="password" placeholder="Enter your password" required><br>
    <input type="hidden" name="csrf_token" value = "{{ csrf_token }}"><br>
    {% if main_info.cloudflare_turnstile_enabled %}
    <div class="cf-turnstile" data-sitekey="{{ main_info.cloudflare_turnstile_site_key }}"></div>
    {% endif %}
    <input type="submit" value="Login">
</form>
{%endblock%}
