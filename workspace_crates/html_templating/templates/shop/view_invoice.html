{% extends "template_base.html" %}
{% block title %}
Invoice
{% endblock %}
{% block content%}
Transfer the exact amount of {{ amount }} {{ currency }} to this address: {{ address }}<br>
<div id="payment_status" data-invoice-id="{{ invoice_id }}">Awaiting payment...</div>
<script nonce="{{ main_info.nonce }}">
    (function () {
        const statusEl = document.getElementById("payment_status");
        const invoiceId = statusEl.dataset.invoiceId;

        async function fetchStatus() {
            try {
                const res = await fetch(`/invoice/json_status?id=${invoiceId}`);
                const data = await res.json();

                if (data.status === "pending") {
                    statusEl.innerText = "Awaiting payment...";
                }

                if (data.status === "confirmations") {
                    statusEl.innerText =
                        `Confirmations ${data.current}/${data.required}`;
                }

                if (data.status === "complete") {
                    statusEl.innerText = "Payment complete";
                    clearInterval(timer);
                }

            } catch (err) {
                console.error("Payment status error:", err);
            }
        }

        fetchStatus(); // immediate call
        let thirty_secs_in_ms = 30_000;
        const timer = setInterval(fetchStatus, thirty_secs_in_ms); 
    })();

</script>
{% endblock %}
