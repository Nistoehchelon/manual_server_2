<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ main_info.title }} {% endblock %}</title>
    <link rel="stylesheet" href="/static/stylesheet.css">
    <link rel="icon" href="/static/favicon.ico">
    {% block head %} {% endblock %}
</head>

<body>
<div id = "navigation">
    {% if main_info.page != "/"  %}
   <p> <a href="/">Main page</a><br></p>
    {% endif %}
</div>
<div id="content">
      {% block content%}
      {%endblock%}
      <script src="/static/app.js" nonce="{{ main_info.nonce }}"></script>
</div>
<div id = "footer">
    <p>© 2094-2142</p>
</div>

</body>
</html>
